<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title description">
  <title id="title">Marcos — Desarrollo creativo</title>
  <desc id="description">Banner oscuro con acentos rojos. Web, gameplay y audio. Usuario maarcosz.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#08080b"/><stop offset=".6" stop-color="#101014"/><stop offset="1" stop-color="#070709"/></linearGradient>
    <linearGradient id="name"><stop stop-color="#fff"/><stop offset="1" stop-color="#b8b8c2"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#f43f5e"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f43f5e" stop-opacity=".12"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="318" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#background)"/>
    <ellipse cx="870" cy="175" rx="240" ry="210" fill="url(#glow)"/>
    <path d="M0 80H1000M0 160H1000M0 240H1000M250 0V320M500 0V320M750 0V320" fill="none" stroke="#202027" stroke-opacity=".5"/>
    <g font-family="Segoe UI,Arial,sans-serif">
      <g font-size="11" font-weight="600" letter-spacing="1.6">
        <text x="50" y="49" fill="#787883">DESARROLLO CREATIVO</text>
        <text x="500" y="49" text-anchor="middle" fill="#f43f5e">WEB · GAMEPLAY · AUDIO</text>
        <text x="950" y="49" text-anchor="end" fill="#92929c">@MAARCOSZ</text>
      </g>
      <path d="M50 67H950" stroke="#2b2b34"/>
      <text x="49" y="155" font-size="78" font-weight="900" letter-spacing="5" fill="url(#name)">MARCO<tspan fill="url(#accent)">S</tspan></text>
      <text x="53" y="204" font-size="24" font-weight="600" fill="#f4f4f5">Código. Diseño. <tspan fill="#fb7185">Sonido.</tspan></text>
      <text x="54" y="238" font-size="15" fill="#a1a1ad">Ideas que se convierten en software.</text>
      <g transform="translate(54 266)" font-size="10" font-weight="600" letter-spacing=".8">
        <rect width="111" height="26" rx="13" fill="#18181f" stroke="#30303a"/>
        <circle cx="15" cy="13" r="3" fill="#f43f5e"/>
        <text x="27" y="17" fill="#e7e7ec">FULL STACK</text>
        <rect x="123" width="128" height="26" rx="13" fill="#18181f" stroke="#30303a"/>
        <text x="138" y="17" fill="#e7e7ec">FIVEM / REDM</text>
        <rect x="263" width="147" height="26" rx="13" fill="#18181f" stroke="#30303a"/>
        <text x="278" y="17" fill="#e7e7ec">AUDIO SOFTWARE</text>
      </g>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M780 136L752 160L780 184M898 136L926 160L898 184" stroke="#858591" stroke-opacity=".4" stroke-width="2"/>
      <path d="M799 160V166M811 150V176M823 131V189M835 113V207M847 135V185M859 145V175M871 151V169M883 157V163" stroke="url(#accent)" stroke-opacity=".8" stroke-width="3"/>
      <path d="M765 225H913" stroke="#39313a"/>
      <circle cx="839" cy="225" r="2.5" fill="#f43f5e" stroke="none"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="318.5" rx="16" fill="none" stroke="#2b2b34" stroke-width="1.5"/>
</svg>
